name: GestarLink • Cloudflare Pages
on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Teste primeiro em preview. Production atualiza gestarlink.com.'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
        working-directory: site
      - run: npm test
        working-directory: site
      - name: Syntax check
        working-directory: site
        run: |
          node --check public/app.js
          node --check public/widget.js
          node --check public/_worker.js
          node --check public/admin.js

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'preview' || inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
        working-directory: site
      - name: Check Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN: ${{ secrets.GESTARLINK_ADMIN_PASSWORD }}
        run: |
          test -n "$TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN in GitHub Actions secrets'; exit 1; }
          test -n "$ACCOUNT" || { echo 'Configure CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets'; exit 1; }
          test "${#ADMIN}" -ge 12 || { echo 'Configure GESTARLINK_ADMIN_PASSWORD with at least 12 characters'; exit 1; }
      - name: Check target Pages project exists
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/gestarlink" \
            | jq -e '.success == true and .result.name == "gestarlink" and .result.production_branch != "preview"'
      - name: Find or create isolated D1 database
        id: database
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ github.event_name == 'push' && 'preview' || inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENV" = "preview" ]; then DB_NAME="gestarlink-crm-preview"; else DB_NAME="gestarlink-crm"; fi
          DATABASE_ID="$(npx wrangler d1 list --json | jq -r --arg name "$DB_NAME" '[.[] | select(.name == $name) | .uuid][0] // empty')"
          if [ -z "$DATABASE_ID" ]; then
            echo "Creating $DB_NAME"
            RES="$(curl --fail --silent --show-error \
              -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg name "$DB_NAME" '{name:$name}')" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            DATABASE_ID="$(printf '%s' "$RES" | jq -er '.result.uuid')"
          fi
          echo "database_id=$DATABASE_ID" >> "$GITHUB_OUTPUT"
          echo "database_name=$DB_NAME" >> "$GITHUB_OUTPUT"
      - name: Download original brand asset
        working-directory: site
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://gestarlink.com/logo.png --output public/logo.png
          test "$(wc -c < public/logo.png)" -ge 1000
      - name: Configure isolated Pages D1 bindings
        working-directory: site
        env:
          DATABASE_ID: ${{ steps.database.outputs.database_id }}
          DATABASE_NAME: ${{ steps.database.outputs.database_name }}
          DEPLOY_ENV: ${{ github.event_name == 'push' && 'preview' || inputs.environment }}
        run: |
          set -euo pipefail
          printf 'name = "gestarlink"\ncompatibility_date = "2026-10-24"\npages_build_output_dir = "./public"\n\n' > wrangler.toml
          if [ "$DEPLOY_ENV" = "preview" ]; then
            printf '[[env.preview.d1_databases]]\nbinding = "DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\n' "$DATABASE_NAME" "$DATABASE_ID" >> wrangler.toml
          else
            printf '[[env.production.d1_databases]]\nbinding = "DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\n' "$DATABASE_NAME" "$DATABASE_ID" >> wrangler.toml
          fi
      - name: Apply database schema
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ steps.database.outputs.database_name }}
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --env "${{ github.event_name == 'push' && 'preview' || inputs.environment }}" --file=./db/schema.sql
      - name: Set private chat/admin secrets (never commit them)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.GESTARLINK_ADMIN_PASSWORD }}
          DEPLOY_ENV: ${{ github.event_name == 'push' && 'preview' || inputs.environment }}
        run: |
          set -euo pipefail
          trap 'rm -f .cf-secrets.json' EXIT
          node -e 'const c=require("node:crypto"),fs=require("node:fs");fs.writeFileSync(".cf-secrets.json",JSON.stringify({ADMIN_PASSWORD:process.env.ADMIN_PASSWORD,SESSION_SECRET:c.randomBytes(48).toString("hex")}));'
          npx wrangler pages secret bulk .cf-secrets.json --project-name gestarlink --env "$DEPLOY_ENV"
      - name: Deploy only to requested environment
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ github.event_name == 'push' && 'preview' || inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENV" = "production" ]; then
            npx wrangler pages deploy public --project-name gestarlink --branch main --commit-hash "$GITHUB_SHA"
          else
            npx wrangler pages deploy public --project-name gestarlink --branch preview --commit-hash "$GITHUB_SHA"
          fi
      - name: Preview live smoke tests (chat, lead, admin and D1)
        if: github.event_name == 'push' || inputs.environment == 'preview'
        working-directory: site
        env:
          SMOKE_URL: https://preview.gestarlink.pages.dev
          SMOKE_ADMIN_PASSWORD: ${{ secrets.GESTARLINK_ADMIN_PASSWORD }}
        run: node test/smoke-preview.mjs

      - name: Verify production health after release
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        run: |
          node --input-type=module - <<'NODE'
          let ok=false;
          for(let attempt=0;attempt<16;attempt++){
            try{
              const h=await fetch('https://gestarlink.com/api/health',{signal:AbortSignal.timeout(12000)});
              const data=await h.json();
              const admin=await fetch('https://gestarlink.com/api/admin/dashboard',{signal:AbortSignal.timeout(12000)});
              const page=await fetch('https://gestarlink.com/',{signal:AbortSignal.timeout(12000)});
              const html=await page.text();
              if(h.ok&&data.ok===true&&admin.status===401&&page.ok&&html.includes('gl-fab')){ok=true;break;}
            }catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ok)throw Error('Production smoke failed: check Cloudflare deployment/domain propagation');
          console.log('PRODUCTION HEALTH, DASHBOARD PROTECTION AND SITE OK');
          NODE
